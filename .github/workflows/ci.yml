name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: contract + no-hardware (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the Jazzy host default; 3.10 covers the Pi 5 Humble runtime.
        python: ["3.10", "3.12"]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        shell: bash
        run: |
          python3 -m pip install --no-cache-dir 'pytest==8.3.4' 'PyYAML==6.0.2'
      - name: Contract and boundary tests
        shell: bash
        run: python3 -m pytest -q tests

      - name: Documentation set
        shell: bash
        run: |
          for f in README.md README.zh-CN.md ROADMAP.md CHANGELOG.md ACCEPTANCE.md LICENSE-REVIEW.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

  ros-build-jazzy:
    name: ros build (jazzy, host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # ros:jazzy-ros-base, multi-arch index digest (Docker Hub, 2026-11-28)
      image: ros:jazzy-ros-base@sha256:5147d3ae250ce754afd399f6bfec15b33dd4e473ca357e30432a3182031bfad6
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-setuptools \
            python3-yaml \
            ros-jazzy-xacro
      - name: Build package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --packages-select jcheng_mobile_bringup \
            --event-handlers console_cohesion+
      - name: Expand the mobile URDF
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xacro ros2_ws/src/jcheng_mobile_bringup/urdf/jcheng_mobile.urdf.xacro \
            > /tmp/jcheng_mobile.urdf
          test -s /tmp/jcheng_mobile.urdf

  # Robot-bound: the ArmPi Ultra Pi 5 runs the vendor ROS 2 Humble container.
  ros-build-humble:
    name: ros build (humble, robot target)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ros:humble-ros-base@sha256:dfc94c85d8e01f230951b2a85ca5576e08473081c3da5fbbe8f3ab844703b9ba
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-setuptools \
            python3-yaml \
            ros-humble-xacro
      - name: Build package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --packages-select jcheng_mobile_bringup \
            --event-handlers console_cohesion+
      - name: Expand the mobile URDF
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro ros2_ws/src/jcheng_mobile_bringup/urdf/jcheng_mobile.urdf.xacro \
            > /tmp/jcheng_mobile.urdf
          test -s /tmp/jcheng_mobile.urdf

  mobile-gate:
    name: mobile-gate
    runs-on: ubuntu-latest
    needs: [contract, ros-build-jazzy, ros-build-humble]
    steps:
      - name: Gate
        run: echo "contract, no-hardware scan, Jazzy host build and Humble robot build passed"

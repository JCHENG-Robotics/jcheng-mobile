  scopes: [base]
  requires_lease: true
  max_rate_hz: 20
  deadman_ms: 500
hardware_access: none
runtime:
  ros_domains: [42]
  publishes:
    - /cmd_vel
    - /odom
    - /map
    - /tf
  subscribes:
    - /scan
    - /tf
